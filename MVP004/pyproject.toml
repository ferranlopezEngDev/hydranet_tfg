[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydranet-mvp004"
version = "0.4.0"
description = "Clean Hydranet base with a desktop GUI, technical CLI, and canonical hydraulic core."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.4.3",
  "scipy==1.17.1",
]

[project.scripts]
hydranet = "hydranet.launcher:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
